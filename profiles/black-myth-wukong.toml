# Cellar game profile — Black Myth: Wukong
#
# Game Science's 2024 action RPG. Windows only, 64-bit, DirectX 12 only, single-player. Denuvo Anti-
# Tamper is DRM, not anti-cheat; it runs untouched. Steam rates it Unsupported on Steam Deck for
# performance. Facts below are from SteamDB's info and config pages, read 2026-11-03. ProtonDB and
# Steam Deck ratings are from the same day.
#
# Not yet run on a Mac by Cellar; status says untested until `cellar verify` passes (issue 203).

[game]
slug          = "black-myth-wukong"
name          = "Black Myth: Wukong"
developer     = "Game Science"
publisher     = "Game Science"
steam_appid   = 2358720
engine        = "Unreal Engine 5"
graphics_api  = "DirectX 12"
architecture  = "x86-64"
released      = "2024-08-20"
store         = "steam"

[compatibility]
anticheat                   = "none (single-player only)"
drm                         = "Steamworks + Denuvo Anti-Tamper"
needs_live_session          = true
requires_account            = "Steam"
online                      = "single-player only"
status                      = "untested"
notes                       = "Not yet launched under Cellar. DirectX 12 only, so Cellar has one way to run it and no second option to offer. Denuvo checks the copy online the first time it starts, and may count a Mac as a new PC. It is demanding: expect to lower its settings on a base Apple Silicon chip."
protondb                    = "gold"
steam_deck                  = "unsupported"
evidence_checked            = "2026-11-03"

[runner]
id              = "wineforge"
windows_version = "win10"

[graphics]
# DirectX 12 only: DXVK and DXMT stop at DX11 and no VKD3D-Proton build ships with the runners, so
# there is deliberately no fallback_backend that could never start it (as for Kingdom Come II).
backend           = "d3dmetal"

[env]

[install]
method      = "windows-steam-in-bottle"
steam_appid = 2358720
# Steam's launch option is b1.exe at the top of the folder (SteamDB config). The exe at the top of the folder starts the Unreal binary under b1/Binaries/Win64; the install_dir needle
# catches either as the game.
install_dir = "BlackMythWukong"
exe         = "b1.exe"

[acceptance]
# What `cellar verify black-myth-wukong` will hold this game to.
# Nothing here has been run yet.
# - signed-in, steam-online: the bottle's Steam is the player's, online, with no sign-in prompt.
# - launch, stays-up: Play starts b1.exe beside a running Steam and the game survives the watch.
# - dock: the Dock says Black Myth: Wukong, never wine or b1.
# - clean-exit, settings-match, real-install-untouched: the baseline every game gets.

[legal]
# Steamworks and Denuvo run untouched inside the layer. Only ever used with a copy the player owns.
drm_circumvention = "never"

[mac]
# The Mac this game needs, and the Mac it is best on (docs/MAC-REQUIREMENTS.md). The PC cards and
# memory are the publisher's own requirements; the Mac lines are what Cellar's rule maps them to
# (MacRequirements.derive), and MacRequirementsTests fails if they drift from it.
pc_requirements_source = "Steam store page, read through System Requirements Lab"
pc_gpu_minimum         = "GeForce GTX 1060"
pc_memory_minimum      = 16
pc_gpu_recommended     = "GeForce RTX 2060"
pc_memory_recommended  = 16
mac_minimum            = "M5"
mac_memory_minimum     = 24
mac_recommended        = "M1 Max"
mac_memory_recommended = 24
requirements_checked   = "2026-11-03"
