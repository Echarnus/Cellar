# Cellar game profile — Monster Hunter Wilds
#
# Capcom's 2025 hunting game with online co-op. Windows only, 64-bit, DirectX 12 only. Denuvo Anti-
# Tamper (SteamDB: up to 5 PCs a day) is DRM, not anti-cheat; it runs untouched. Facts below are
# from SteamDB's info and config pages, read 2026-11-03. ProtonDB and Steam Deck ratings are from
# the same day.
#
# Not yet run on a Mac by Cellar; status says untested until `cellar verify` passes (issue 203).

[game]
slug          = "monster-hunter-wilds"
name          = "Monster Hunter Wilds"
developer     = "Capcom"
publisher     = "Capcom"
steam_appid   = 2246340
engine        = "RE Engine"
graphics_api  = "DirectX 12"
architecture  = "x86-64"
released      = "2025-02-28"
store         = "steam"

[compatibility]
anticheat                   = "none listed"
drm                         = "Steamworks + Denuvo Anti-Tamper"
needs_live_session          = true
requires_account            = "Steam"
online                      = "single-player with online co-op through Capcom's servers"
status                      = "untested"
notes                       = "Not yet launched under Cellar. DirectX 12 only, so Cellar has one way to run it and no second option to offer. Denuvo checks the copy online the first time it starts, and may count a Mac as a new PC."
protondb                    = "gold"
steam_deck                  = "verified"
evidence_checked            = "2026-11-03"

[runner]
id              = "wineforge"
windows_version = "win10"

[graphics]
# DirectX 12 only: DXVK and DXMT stop at DX11 and no VKD3D-Proton build ships with the runners, so
# there is deliberately no fallback_backend that could never start it (as for Kingdom Come II).
backend           = "d3dmetal"

[env]

[install]
method      = "windows-steam-in-bottle"
steam_appid = 2246340
# Steam's launch option is MonsterHunterWilds.exe at the top of the folder (SteamDB config).
install_dir = "MonsterHunterWilds"
exe         = "MonsterHunterWilds.exe"

[acceptance]
# What `cellar verify monster-hunter-wilds` will hold this game to.
# Nothing here has been run yet.
# - signed-in, steam-online: the bottle's Steam is the player's, online, with no sign-in prompt.
# - launch, stays-up: Play starts MonsterHunterWilds.exe beside a running Steam and it survives the watch.
# - dock: the Dock says Monster Hunter Wilds, never wine.
# - clean-exit, settings-match, real-install-untouched: the baseline every game gets.
# After the first run: add online_hosts only for hosts the game's process was seen holding.

[legal]
# Steamworks and Denuvo run untouched inside the layer. Only ever used with a copy the player owns.
drm_circumvention = "never"
