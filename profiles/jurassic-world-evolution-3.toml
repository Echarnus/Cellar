# Cellar game profile — Jurassic World Evolution 3
#
# Frontier's 2025 sequel on its COBRA engine. Windows only on Steam, 64-bit, DirectX 12 only, with
# DirectStorage. Denuvo Anti-Tamper per SteamDB: DRM, not anti-cheat; it runs untouched but wants a
# running Steam. Facts are from SteamDB's info, config and cloud pages and the Steam store page,
# read 2026-11-05. Steam Deck: Playable (first start needs the internet).
# Mac reports: the only one found (CloudDeck, a cloud-streaming service, early 2026) says it closes
# at launch through CrossOver even with AVX exposed to the game. That is weak evidence from a seller
# of the alternative, but it is the only report, so mac_reports says fails until a run says otherwise.
# Runs on the newer D3DMetal, as Planet Coaster 2 and Jurassic World Evolution 2 do. No AVX switch
# (ROSETTA_ADVERTISE_AVX) until a run shows it matters: the report says it did not help.
# Cellar's own wineserver (#261) ships with the WineForge runner.
# Not yet run on a Mac by Cellar; status says untested until `cellar verify` passes (issue 203).

[game]
slug          = "jurassic-world-evolution-3"
name          = "Jurassic World Evolution 3"
developer     = "Frontier Developments"
publisher     = "Frontier Developments"
steam_appid   = 2958130
engine        = "COBRA"
graphics_api  = "DirectX 12"
architecture  = "x86-64"
released      = "2025-10-21"
store         = "steam"

[compatibility]
anticheat                   = "none"
drm                         = "Steamworks + Denuvo Anti-Tamper"
needs_live_session          = true
requires_account            = "Steam"
online                      = "single-player; the first start needs the internet"
status                      = "untested"
notes                       = "Not yet launched under Cellar. The one report from a Mac player says it closes at start through CrossOver, so it may not run yet."
mac_reports                 = "fails"
protondb                    = "gold"
steam_deck                  = "playable"
evidence_checked            = "2026-11-05"

[runner]
id              = "wineforge-d3dmetal4"
windows_version = "win10"

[graphics]
# DirectX 12 only: no fallback_backend that could never start it (as for Hogwarts Legacy).
backend           = "d3dmetal"

[env]

[install]
method      = "windows-steam-in-bottle"
steam_appid = 2958130
# SteamDB config: installdir "Jurassic World Evolution 3", default launch option JWE3.exe.
# Anning.release/profile.exe are Frontier's build variants, not the game players start.
install_dir = "Jurassic World Evolution 3"
exe         = "JWE3.exe"

[art]
# A late-2025 release: art only under the hashed store_item_assets path (SteamDB info page, 2026-11-05).
art_portrait = "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2958130/317faa59ced4fff3eae44f72df7785b841340eb5/library_600x900.jpg"
art_hero     = "https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/2958130/48c655a646aaa490ee02f324d0037a640b8c9ebb/library_hero.jpg"

[acceptance]
# What `cellar verify jurassic-world-evolution-3` will hold this game to. Nothing here has been run yet.
# - signed-in, steam-online: the bottle's Steam is the player's, online, with no sign-in prompt.
# - launch, stays-up: Play starts JWE3.exe beside a running Steam and it survives the watch. A close
#   at start is the CrossOver report above: record what crashed, don't hide it.
# - dlc: owned DLC packs show in the game when the account owns them.
# - dock: the Dock says Jurassic World Evolution 3, never wine or JWE3.
# - clean-exit, settings-match, real-install-untouched: the baseline every game gets.
# After the first run: save_paths (Steam Cloud names Saved Games/Frontier Developments/Jurassic
# World Evolution 3/<SteamID>/Saves), online_hosts only for hosts the game was seen holding.

[legal]
drm_circumvention = "never"

[mac]
# The Mac this game needs, and the Mac it is best on (docs/MAC-REQUIREMENTS.md). The PC cards and
# memory are the publisher's own requirements; the Mac lines are what Cellar's rule maps them to
# (MacRequirements.derive), and MacRequirementsTests fails if they drift from it.
pc_requirements_source = "Steam store page, read directly"
pc_gpu_minimum         = "GeForce GTX 1060"
pc_memory_minimum      = 16
pc_gpu_recommended     = "GeForce RTX 2070 Super"
pc_memory_recommended  = 16
mac_minimum            = "M5"
mac_memory_minimum     = 24
mac_recommended        = "M3 Max"
mac_memory_recommended = 24
requirements_checked   = "2026-11-05"
