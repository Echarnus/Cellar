# Cellar game profile — Sleeping Dogs: Definitive Edition
#
# The 2014 remaster of United Front's Hong Kong open-world game, with its DLC included. Steam also
# lists a Mac build, an Intel-only port from years ago that does not run natively on Apple Silicon;
# Cellar runs the Windows build, 64-bit, DirectX 11. Facts below are from SteamDB's info and config
# pages, read 2026-11-03. ProtonDB and Steam Deck ratings are from the same day.
#
# Not yet run on a Mac by Cellar; status says untested until `cellar verify` passes (issue 203).

[game]
slug          = "sleeping-dogs-definitive-edition"
name          = "Sleeping Dogs: Definitive Edition"
developer     = "United Front Games"
publisher     = "Square Enix"
steam_appid   = 307690
engine        = "United Front Games in-house"
graphics_api  = "DirectX 11"
architecture  = "x86-64"
released      = "2014-10-14"
store         = "steam"

[compatibility]
anticheat                   = "none (single-player only)"
drm                         = "Steamworks (no third-party DRM listed)"
needs_live_session          = true
requires_account            = "Steam"
online                      = "single-player only"
status                      = "untested"
notes                       = "Not yet launched under Cellar. DirectX 11, which Cellar has two ways to run, so it can offer the second if the first does not start. All of the original game's DLC is included in this edition."
protondb                    = "gold"
steam_deck                  = "playable"
evidence_checked            = "2026-11-03"

[runner]
id              = "wineforge"
windows_version = "win10"

[graphics]
backend           = "d3dmetal"
fallback_backend  = "dxvk"

[env]

[install]
method      = "windows-steam-in-bottle"
steam_appid = 307690
# Steam's Windows launch option is SDHDShip.exe at the top of the folder (SteamDB config).
install_dir = "SleepingDogsDefinitiveEdition"
exe         = "SDHDShip.exe"

[acceptance]
# What `cellar verify sleeping-dogs-definitive-edition` will hold this game to.
# Nothing here has been run yet.
# - signed-in, steam-online: the bottle's Steam is the player's, online, with no sign-in prompt.
# - launch, stays-up: Play starts SDHDShip.exe beside a running Steam and it survives the watch.
# - dock: the Dock says Sleeping Dogs: Definitive Edition, never wine or SDHDShip.
# - clean-exit, settings-match, real-install-untouched: the baseline every game gets.

[legal]
# Steamworks run untouched inside the layer. Only ever used with a copy the player owns.
drm_circumvention = "never"
