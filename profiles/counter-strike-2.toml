# Cellar game profile — Counter-Strike 2
#
# Valve's Source 2 shooter, number one on Steam's Most Played chart (1.16M players, 2026-11-01).
# There is no Mac version: Valve's store page lists Windows and SteamOS + Linux, and the
# "Limited Test" macOS launch option still in SteamDB's config is a leftover that ships no Mac build.
# Facts below are from the Steam store page and SteamDB's config for app 730, read 2026-11-01.
#
# Not yet run on a Mac by Cellar; status says untested until `cellar verify` passes (issue 203).

[game]
slug          = "counter-strike-2"
name          = "Counter-Strike 2"
developer     = "Valve"
publisher     = "Valve"
steam_appid   = 730
engine        = "Source 2"
graphics_api  = "DirectX 11"
architecture  = "x86-64"
released      = "2023-09-27"
store         = "steam"

[compatibility]
# VAC (Valve Anti-Cheat) runs in user space, not in the kernel, so nothing has to be translated
# below Wine. Cellar runs it untouched. Valve does not support playing through a translation layer,
# so the profile says online play is at the player's own risk rather than implying it is safe.
anticheat                   = "VAC (Valve Anti-Cheat, user space, not kernel-level)"
drm                         = "Steamworks (needs a running Steam client)"
needs_live_session          = true
requires_account            = "Steam"
online                      = "online multiplayer on Valve servers; Valve does not support translation layers, so playing online is at your own risk"
status                      = "untested"
notes                       = "Not yet launched under Cellar. CodeWeavers made CrossOver 23.6 run it out of the box on Apple Silicon, and community guides report it playable through CrossOver at lowered settings. Valve does not support it under Wine, so a game or macOS update can break it overnight."

# WineForge, as for every Steam title: the current Steam client needs a modern Wine.
[runner]
id              = "wineforge"
windows_version = "win10"

[graphics]
# DirectX 11 on Windows: D3DMetal first, DXVK the second route the launch window offers once if the
# game never comes up. Which of the two CrossOver itself uses for CS2 is not published.
backend           = "d3dmetal"
fallback_backend  = "dxvk"

[env]

[install]
method      = "windows-steam-in-bottle"
steam_appid = 730
# The install folder kept CS:GO's name when CS2 replaced it in the same AppID. Steam's Windows
# launch option is game\bin\win64\cs2.exe with -steam, which the client adds itself.
install_dir = "Counter-Strike Global Offensive"
exe         = "game/bin/win64/cs2.exe"

[legal]
# VAC and Steamworks run untouched inside the layer. Only ever used with the player's own account.
drm_circumvention = "never"
