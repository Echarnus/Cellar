# Cellar game profile — Stardew Valley
# The reference DRM-free title: it runs straight from its files with no Steam at all, so it
# exercises Cellar's fully Steam-free path (DepotDownloader to fetch, direct exe launch to play).
# Untested on M5 — config is the demonstrator for the steam-free flow.

[game]
slug          = "stardew-valley"
name          = "Stardew Valley"
developer     = "ConcernedApe"
steam_appid   = 413150
engine        = "MonoGame"
graphics_api  = "DirectX 11"
architecture  = "x86-64"
released      = "2016-02-26"

# A Steam game that needs no Steam client: the files are fetched with DepotDownloader and the exe
# is run directly (`needs_live_session = false` below).
store         = "steam"

[compatibility]
anticheat                   = "none"
drm                         = "none (DRM-free)"
# DRM-free: no Steam needed to play. Cellar downloads it with DepotDownloader and launches the exe
# directly — no Windows Steam client involved at all. This is the Proton-like ideal case.
needs_live_session          = false
requires_account            = "none"
online                      = "single-player + co-op"
status                      = "untested"
notes                       = "Reference case for the fully Steam-free path (cellar install + direct launch)."
protondb                    = "platinum"
steam_deck                  = "verified"
evidence_checked            = "2026-11-03"

[runner]
id              = "wineforge"
windows_version = "win10"

[graphics]
backend           = "d3dmetal"
fallback_backend  = "dxmt"

[install]
method      = "depot"
steam_appid = 413150

[launch]
exe = "Stardew Valley.exe"

[legal]
drm_circumvention = "never"

[mac]
# The Mac this game needs, and the Mac it is best on (docs/MAC-REQUIREMENTS.md). The PC cards and
# memory are the publisher's own requirements; the Mac lines are what Cellar's rule maps them to
# (MacRequirements.derive), and MacRequirementsTests fails if they drift from it.
pc_requirements_source = "Steam store page, read through System Requirements Lab; a 256 MB Shader Model 3 card, and only a minimum"
pc_gpu_minimum         = "DirectX 9 card with Shader Model 3"
pc_memory_minimum      = 2
pc_gpu_recommended     = "DirectX 9 card with Shader Model 3"
pc_memory_recommended  = 2
mac_minimum            = "M1"
mac_memory_minimum     = 8
mac_recommended        = "M1"
mac_memory_recommended = 8
requirements_checked   = "2026-11-03"
