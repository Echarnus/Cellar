# Cellar game profile — R.E.P.O.
#
# semiwork's online co-op horror game, in Early Access since 2025-02-26, rank 33 on Steam's Most
# Played chart (56K players, 2026-11-01). Windows only, Unity, DirectX 10 minimum.
# Facts below are from the Steam store page and SteamDB's config, read 2026-11-01. Not yet run on a
# Mac by Cellar; status says untested until `cellar verify` passes (issue 203).

[game]
slug          = "repo"
name          = "R.E.P.O."
developer     = "semiwork"
publisher     = "semiwork"
steam_appid   = 3241660
engine        = "Unity"
graphics_api  = "DirectX 11"
architecture  = "x86-64"
released      = "2025-02-26"
store         = "steam"

[compatibility]
anticheat                   = "none listed"
drm                         = "Steamworks (no third-party DRM listed)"
needs_live_session          = true
requires_account            = "Steam"
online                      = "online co-op for up to 6, single-player"
status                      = "untested"
notes                       = "Not yet launched under Cellar. Still in Early Access, so updates can change what works."
protondb                    = "platinum"
steam_deck                  = "playable"
evidence_checked            = "2026-11-03"

[runner]
id              = "wineforge"
