# Cellar game profile — Planet Coaster 2
# Schema version 0 (Phase 0 draft). Fields are descriptive until the Phase 2 loader lands.
# All facts below are sourced from verified 2026 research (see docs/RESEARCH.md).

[game]
slug          = "planet-coaster-2"
name          = "Planet Coaster 2"
developer     = "Frontier Developments"
steam_appid   = 2688950
engine        = "COBRA"
graphics_api  = "DirectX 12"
architecture  = "x86-64"
released      = "2024-11-06"

# Which client Cellar stands up in the bottle for this game. Steam is the default, but every
# profile says so out loud now that Cellar speaks more than one store (see docs/ARCHITECTURE.md).
store         = "steam"

[compatibility]
# No kernel anti-cheat (no EAC / BattlEye / Vanguard) — Wine/D3DMetal friendly.
anticheat                   = "none"
# Denuvo *Anti-tamper* (DRM, NOT anti-cheat). Runs in user space, through the layer.
# Needs a live Steam session — which is why "Windows Steam in the bottle" is the default install.
drm                         = "denuvo-anti-tamper"
requires_live_steam_session = true
# Denuvo + live Steam session: cannot run without the Steam client. Cellar keeps it silent.
needs_live_steam            = true
requires_account            = "Frontier"
online                      = "single-player core + online co-op / async multiplayer / cross-platform saves"
status                      = "playable"        # M5 / macOS 26.5: main menu verified via D3DMetal 3.0 (2026-09-07); in-park validation pending
notes                       = "Needs Wine ≥ 10.8 (GS-base switch) AND a D3DMetal-compatible Wine: WineForge. Menu ~53 FPS at 1512x982 with the Metal debug layer on (M5)."

# Runner: WineForge (Wine 11.17 + CrossOver macOS patches) + Apple D3DMetal 3.0.
#  - GPTK (Wine 7.7): the current Steam client's web helper crash-loops.
#  - Sikarugir Wine 10.0: Steam works, but PC2 inlines GetCurrentFiber() as `gs:[0x20]`, which on
#    macOS Wine < 10.8 reads a Mach port instead of the fiber → access violation at startup.
#  - Stock Wine 11: fibers fine, but D3DMetal's DLLs import the removed ntdll.__wine_unix_call.
#  - WineForge: both fixed. D3DMetal comes from the Sikarugir template (renderer/d3dmetal), grafted
#    into <runner>/wine/lib/d3dmetal and selected with GRAPHICS_BACKEND=d3dmetal.
[runner]
id              = "wineforge"
windows_version = "win10"

[graphics]
# Primary path for this DX12 title on Apple Silicon.
backend           = "d3dmetal"
# Fallback if D3DMetal misbehaves on a given driver/title:
fallback_backend  = "dxvk"
metalfx_upscaling = true
retina            = false

[env]
# Metal's API validation layer. Counter-intuitive but load-bearing: without it PC2 dies within
# ~20 s inside D3DMetal.framework (garbage pointer in D3DMetal code) or raises its own fatal
# 0xFDEAD; with full validation on it has survived every run (menu, in-park, 6+ min sessions).
# Things that do NOT help: shader validation alone, the layer with its checks switched off (1 of 2
# runs crashed), D3DM_BOUNDS_CHECK, D3DM_RETAIN_REFERENCES, D3DM_ENABLE_ASYNC_COMMIT=0, disabling
# the Steam overlay, dropping DXR. Cost on an M5: menu 53 FPS instead of 57. Treat as a workaround
# for a D3DMetal 3.0 race until Apple / CodeWeavers ship the real fix (CrossOver 26 lists PC2 fixes).
MTL_DEBUG_LAYER = "1"
MTL_DEBUG_LAYER_ERROR_MODE = "nslog"

[dll_overrides]
# None required as a baseline; add here if a specific build needs them.

[install]
# Robust, fully-legitimate path: install Windows Steam into the bottle and let it
# download / validate / update the owned game.
method      = "windows-steam-in-bottle"
steam_appid = 2688950
# Experimental alternative (owned game only): depot download via DepotDownloader (-os windows).
# Note: a bare depot dump may not boot because of the live-session DRM requirement.
experimental_depot_download = false

[legal]
# Cellar never circumvents DRM; Denuvo runs untouched inside the layer.
# Only ever used with a copy of the game you own.
drm_circumvention = "never"
