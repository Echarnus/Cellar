# Cellar game profile — DARK SOULS III
#
# FromSoftware's 2016 action RPG. DirectX 11, 64-bit, Windows only, with the exe under Game/ in
# Steam's install folder. No third-party anti-cheat (that is Elden Ring); online play runs through
# FromSoftware's servers, which came back on PC in 2022 after that year's shutdown.
# Not yet run on a Mac by Cellar; status says untested until `cellar verify` passes.

[game]
slug          = "dark-souls-3"
name          = "DARK SOULS III"
developer     = "FromSoftware"
publisher     = "Bandai Namco Entertainment"
steam_appid   = 374320
engine        = "Dantelion"
graphics_api  = "DirectX 11"
architecture  = "x86-64"
released      = "2016-04-11"
store         = "steam"

[compatibility]
anticheat                   = "none listed"
drm                         = "Steamworks (no third-party DRM listed)"
needs_live_session          = true
requires_account            = "Steam"
online                      = "single-player, with online co-op, invasions and messages through FromSoftware's servers"
status                      = "untested"
notes                       = "Not yet launched under Cellar."
protondb                    = "platinum"
steam_deck                  = "verified"
evidence_checked            = "2026-11-03"

# WineForge, as for every Steam title: the current Steam client needs a modern Wine, and Steamworks
# needs that client running beside the game.
[runner]
id              = "wineforge"
windows_version = "win10"

[graphics]
backend           = "d3dmetal"
fallback_backend  = "dxvk"

[env]

[install]
# Installed by the bottle's Steam, which is already signed in: a depot download would sign in a
# second time for a game that needs the client running anyway.
method      = "windows-steam-in-bottle"
steam_appid = 374320
install_dir = "DARK SOULS III"
exe         = "Game/DarkSoulsIII.exe"

[legal]
drm_circumvention = "never"

[mac]
# The Mac this game needs, and the Mac it is best on (docs/MAC-REQUIREMENTS.md). The PC cards and
# memory are the publisher's own requirements; the Mac lines are what Cellar's rule maps them to
# (MacRequirements.derive), and MacRequirementsTests fails if they drift from it.
pc_requirements_source = "Steam store page, read through System Requirements Lab"
pc_gpu_minimum         = "GeForce GTX 750 Ti"
pc_memory_minimum      = 4
pc_gpu_recommended     = "GeForce GTX 970"
pc_memory_recommended  = 8
mac_minimum            = "M1"
mac_memory_minimum     = 8
mac_recommended        = "M5"
mac_memory_recommended = 16
requirements_checked   = "2026-11-03"
