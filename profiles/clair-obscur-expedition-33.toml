# Cellar game profile — Clair Obscur: Expedition 33
#
# Sandfall Interactive's 2025 turn-based RPG. Windows only, 64-bit, DirectX 12 only, single-player,
# with no anti-cheat or third-party DRM listed. Facts below are from SteamDB's info and config
# pages, read 2026-11-03. ProtonDB and Steam Deck ratings are from the same day.
#
# Not yet run on a Mac by Cellar; status says untested until `cellar verify` passes (issue 203).

[game]
slug          = "clair-obscur-expedition-33"
name          = "Clair Obscur: Expedition 33"
developer     = "Sandfall Interactive"
publisher     = "Kepler Interactive"
steam_appid   = 1903340
engine        = "Unreal Engine 5"
graphics_api  = "DirectX 12"
architecture  = "x86-64"
released      = "2025-04-24"
store         = "steam"

[compatibility]
anticheat                   = "none (single-player only)"
drm                         = "Steamworks (no third-party DRM listed)"
needs_live_session          = true
requires_account            = "Steam"
online                      = "single-player only"
status                      = "untested"
notes                       = "Not yet launched under Cellar. DirectX 12 only, so Cellar has one way to run it and no second option to offer."
protondb                    = "platinum"
steam_deck                  = "verified"
evidence_checked            = "2026-11-03"

[runner]
id              = "wineforge"
windows_version = "win10"

[graphics]
# DirectX 12 only: DXVK and DXMT stop at DX11 and no VKD3D-Proton build ships with the runners, so
# there is deliberately no fallback_backend that could never start it (as for Kingdom Come II).
backend           = "d3dmetal"

[env]

[install]
method      = "windows-steam-in-bottle"
steam_appid = 1903340
# Steam's launch option is Expedition33_Steam.exe at the top of the folder (SteamDB config). The exe at the top of the folder starts the Unreal binary under Sandfall/Binaries/Win64; the install_dir needle
# catches either as the game.
install_dir = "Expedition 33"
exe         = "Expedition33_Steam.exe"

[acceptance]
# What `cellar verify clair-obscur-expedition-33` will hold this game to.
# Nothing here has been run yet.
# - signed-in, steam-online: the bottle's Steam is the player's, online, with no sign-in prompt.
# - launch, stays-up: Play starts Expedition33_Steam.exe beside a running Steam and the game survives the watch.
# - dock: the Dock says Clair Obscur: Expedition 33, never wine or Expedition33_Steam.
# - clean-exit, settings-match, real-install-untouched: the baseline every game gets.

[legal]
# Steamworks run untouched inside the layer. Only ever used with a copy the player owns.
drm_circumvention = "never"
