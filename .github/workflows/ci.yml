name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & self-test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Self-test (VDF/CRC/shortcut codecs)
        run: swift run -c release cellar selftest

      # Unit tests + the hermetic integration tier. The Wine tiers (CELLAR_IT=1) are deliberately
      # not run here: a hosted runner has no reason to download a 400 MB Wine build and nothing
      # worth translating to. See docs/TESTING.md.
      - name: Tests
        run: sh Scripts/test.sh
      - name: Generate supported-games site (sanity)
        run: python3 Scripts/gen-site.py
