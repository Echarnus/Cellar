name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

# Every job only reads the repository. A job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & self-test (${{ matrix.os }})
    # The oldest and newest macOS images GitHub hosts, so an SDK deprecation or removal shows up
    # here before it reaches a player on a new macOS.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      # Unit + hermetic integration tiers, with line coverage held to Tests/coverage-baseline.json:
      # a change that lowers it fails here and says which files are least covered.
      - name: Test suite + coverage ratchet
        run: sh Scripts/test.sh --coverage
      # SwiftPM does not build the Dock shim (it has to be universal), so nothing else here would
      # notice if it stopped compiling.
      - name: Build the Dock shim (universal)
        run: sh Scripts/build-dock-shim.sh
      - name: Self-test (VDF/CRC/shortcut codecs)
        run: swift run -c release cellar selftest
      # The release path itself: the bundle with its own CLI and Sparkle.framework, sealed and verified
      # by package.sh. Without this, nothing short of a tagged release would notice it breaking.
      - name: Package the app (sanity)
        run: |
          sh Scripts/package.sh 0.0.0-ci
          APP=dist/Cellar.app/Contents
          test -f "$APP/Frameworks/Sparkle.framework/Sparkle"
          otool -l "$APP/MacOS/CellarApp" | grep -q '@executable_path/../Frameworks'
          "$APP/MacOS/cellar" --version
      # The rendered store marks, light and dark. A reviewer can look at the actual pixels a PR
      # produces without checking it out and launching the app.
      - name: Upload rendered UI snapshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots-${{ matrix.os }}
          path: .build/ui-snapshots/*.png
          if-no-files-found: warn
      - name: Generate supported-games site (sanity)
        run: python3 Scripts/gen-site.py

  lint:
    name: Lint (workflows, shell, Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Downloaded by version and checked against its published checksum, so a moved release
      # cannot slip a different binary in.
      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint
          ./actionlint -color
      # ShellCheck ships on the runner image. Warnings and errors fail the job; style notes do not.
      - name: ShellCheck
        run: shellcheck --severity=warning Scripts/*.sh
      - name: Python compiles (3.9 floor)
        run: python3 -m py_compile Scripts/*.py

  wine:
    name: Wine tiers (real runner, real Windows exe)
    # Tiers B and C of docs/TESTING.md: a real runner installs, a real prefix initialises, and a
    # Windows PE starts under Cellar's own launch path and is shut down again. The unit suite proves
    # Cellar decides correctly; this proves a Windows program actually runs, before the merge rather
    # than on the player's Mac. Not a required check yet — it downloads a runner from upstream on
    # every run, and has to prove it is stable on hosted runners first (docs/TESTING.md).
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every runner Cellar ships is x86_64 Wine. Hosted images may come without Rosetta; without it
      # tier B fails on its own precondition rather than skipping, so it is installed first.
      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Install the default runner
        run: |
          swift build -c release --product cellar
          .build/release/cellar runner install
          .build/release/cellar runner list
      - name: Wine tiers
        env:
          # The sandbox lands somewhere the log upload below can find it; a failed run keeps it.
          TMPDIR: ${{ runner.temp }}
        run: sh Scripts/test.sh --integration --filter CellarIntegrationTests
      - name: Upload Wine logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wine-tier-logs
          path: ${{ runner.temp }}/cellar-tests.*/home/logs/
          if-no-files-found: ignore
