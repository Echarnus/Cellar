name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & self-test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Test suite
        run: sh Scripts/test.sh
      # SwiftPM does not build the Dock shim (it has to be universal), so nothing else here would
      # notice if it stopped compiling.
      - name: Build the Dock shim (universal)
        run: sh Scripts/build-dock-shim.sh
      - name: Self-test (VDF/CRC/shortcut codecs)
        run: swift run -c release cellar selftest
      # The rendered store marks, light and dark. A reviewer can look at the actual pixels a PR
      # produces without checking it out and launching the app.
      - name: Upload rendered UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: .build/ui-snapshots/*.png
          if-no-files-found: warn
      - name: Generate supported-games site (sanity)
        run: python3 Scripts/gen-site.py
