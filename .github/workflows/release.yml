name: Release

# Cut a release from main in one of two ways (see docs/RELEASING.md):
#
#   git tag -a v0.4.0 -m "Cellar 0.4.0" && git push origin v0.4.0
#   gh workflow run release.yml --ref main -f version=0.4.0 -f publish=true
#
# The second creates the tag itself, on the commit it built and tested, so a release needs no local
# tag push. Without `publish`, a manual run only builds the downloads.
#
# The notes list every issue the release closes, grouped by label (Scripts/release-notes.py),
# followed by GitHub's list of merged pull requests. A version with a suffix (v0.4.0-beta.1) is
# published as a pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.4.0)"
        required: true
        default: "0.0.0-manual"
      publish:
        description: "Tag this commit v<version> and publish the release (main only)"
        type: boolean
        default: false

permissions:
  contents: read

# Two tags pushed close together must not race on the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build downloads
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      version: ${{ steps.v.outputs.version }}
    # The Swift package and its release scripts live in app/ (#133).
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          if [ "$EVENT" = "push" ]; then version="${REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          # A release is cut from main and nowhere else, whichever way it is started.
          releasing=false
          if [ "$EVENT" = "push" ] || [ "$PUBLISH" = "true" ]; then releasing=true; fi
          if [ "$EVENT" != "push" ] && [ "$releasing" = "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::A release is published from main only; this run is on $REF."
            exit 1
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a SemVer version (expected e.g. 0.4.0 or 0.4.0-beta.1)"
            exit 1
          fi
          # The app, the CLI and every diagnostics report name CellarVersion.current, so a tag that
          # disagrees with it would ship a build that misreports its own version.
          # Found rather than hard-coded, so moving the file can't silently switch the check off.
          version_file="$(find . -name CellarVersion.swift -not -path './.build/*' | head -n 1)"
          source_version="$(sed -n 's/.*static let current = "\(.*\)".*/\1/p' "${version_file:-/dev/null}")"
          if [ "$releasing" = "true" ] && [ "$source_version" != "$version" ]; then
            echo "::error::Release v$version but CellarVersion.current is '$source_version'. Bump app/${version_file#./} in a PR first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test suite
        run: sh Scripts/test.sh
      - name: Package (app + CLI zips)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: sh Scripts/package.sh "$VERSION"
      - name: Build installer DMG
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: sh Scripts/make-dmg.sh "$VERSION"
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 ./*.dmg ./*.zip | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cellar-${{ steps.v.outputs.version }}
          path: |
            app/dist/*.zip
            app/dist/*.dmg
            app/dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: build
    runs-on: xcode-27
    timeout-minutes: 20
    # The update-signing key lives in this environment, not in plain repository secrets, so only a
    # release run can read it. Add a tag rule to the environment to restrict it to v* tags.
    environment:
      name: release
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: write     # create the release (and, for a manual run, its tag)
      issues: read        # list the issues it closes
      pull-requests: read
      id-token: write     # build provenance
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the notes walk the history back to the previous tag
          persist-credentials: false
      # A manual release tags the exact commit the build job tested. The tags ruleset forbids moving
      # or deleting a v* tag, so an existing one is refused here rather than overwritten. A tag made
      # with this token starts no new workflow run, so this run is the only one for the release.
      - name: Create the tag (manual release)
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ github.sha }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Bump the version and run again."
            exit 1
          fi
          tag_sha="$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f message="Cellar $VERSION" \
            -f object="$SHA" -f type=commit --jq .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_sha" >/dev/null
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "Tagged $SHA as $TAG"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cellar-${{ needs.build.outputs.version }}
          path: app/dist
      - name: Release notes from closed issues
        run: |
          python3 Scripts/release-notes.py --repo "$REPO" --tag "$TAG" --out dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      # Signs the app zip for the in-app updater and writes dist/appcast.xml. Skipped until the
      # updater's script, its public key (Scripts/sparkle-keys.sh) and the signing secret are all
      # in place, so a release before then simply ships without an update feed.
      - name: Update feed (appcast)
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -f Scripts/make-appcast.sh ] && [ -f Resources/sparkle-public-key ] && [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            sh Scripts/make-appcast.sh "$VERSION" dist/RELEASE_NOTES.md
          else
            echo "::notice::No appcast: needs Scripts/make-appcast.sh, Resources/sparkle-public-key and the SPARKLE_ED_PRIVATE_KEY secret."
          fi
      # The game database between releases (ProfileUpdates): profiles.json + its Ed25519 signature,
      # published with every release once the key exists (Scripts/signing-keys.sh). Without the
      # key nothing is published, because no installed Cellar would accept an unsigned set.
      - name: Game database (profiles.json)
        env:
          PROFILES_SIGNING_KEY: ${{ secrets.PROFILES_SIGNING_KEY }}
        run: |
          if [ -n "$PROFILES_SIGNING_KEY" ]; then
            swift Scripts/profiles-bundle.swift "$VERSION" dist
          else
            echo "::notice::No game database published: needs the PROFILES_SIGNING_KEY secret (Scripts/signing-keys.sh)."
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            app/dist/*.dmg
            app/dist/*.zip
      - name: Publish
        id: publish
        run: |
          set -- dist/*.dmg dist/*.zip dist/SHA256SUMS.txt
          [ -f dist/appcast.xml ] && set -- "$@" dist/appcast.xml
          [ -f dist/profiles.json.sig ] && set -- "$@" dist/profiles.json dist/profiles.json.sig
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          # shellcheck disable=SC2086 # $prerelease is intentionally empty or one flag
          gh release create "$TAG" "$@" --repo "$REPO" --verify-tag $prerelease \
            --title "Cellar $VERSION" --notes-file dist/RELEASE_NOTES.md
          echo "url=https://github.com/$REPO/releases/tag/$TAG" >> "$GITHUB_OUTPUT"
